name: NordBuds Android Build

on:
push:
branches: [main, master]
pull_request:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android SDK tools
    shell: bash
    run: |
      set -euo pipefail
      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
        -type f -name sdkmanager 2>/dev/null | head -n 1)"

      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: Android SDK sdkmanager not found."
        exit 1
      fi

      echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      echo "Found Android SDK manager."

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      set -euo pipefail
      yes | "$SDKMANAGER" --licenses || true

  - name: Install Android SDK packages
    run: |
      "$SDKMANAGER" --install \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0"

  - name: Set up Gradle 8.11.1
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  - name: Verify Java and Gradle
    run: |
      java -version
      gradle --version

  - name: Build debug APK
    run: gradle --no-daemon --stacktrace assembleDebug

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: NordBuds-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
