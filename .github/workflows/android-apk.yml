
name: Build Nord Buds Studio APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/app/build.gradle}"

            if [ -f "$candidate/settings.gradle" ] &&
               [ -f "$candidate/build.gradle" ] &&
               [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -type f -path '*/app/build.gradle' \
            -not -path '*/.gradle/*' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project files not found."
            echo "Repository file listing:"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/app/src/main" \
            -type f -name 'MainActivity.java' -print -quit |
            grep -q .
          echo "MainActivity.java found."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NordBudsStudio-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
          
