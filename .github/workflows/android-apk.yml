name: Build Budsy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip budsy.zip if project is still zipped
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n1)" ]; then
            z=$(find . -iname "*.zip" | head -n1)
            if [ -n "$z" ]; then
              echo "Extracting $z"
              mkdir -p _project
              unzip -q -o "$z" -d _project
            fi
          fi

      - name: Find Gradle project folder
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Upload the extracted Budsy project files (app folder, settings.gradle.kts, build.gradle.kts) to the repo."
            ls -R | head -40
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Apply known Kotlin compile fixes
        env:
          PROJECT_DIR: ${{ steps.p.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          fixes = {
              root / "app/src/main/java/com/nordbuds/studio/MainActivity.kt":
                  "import androidx.compose.animation.core.animateFloat",
              root / "app/src/main/java/com/nordbuds/studio/Screens.kt":
                  "import androidx.compose.foundation.border",
          }
          for path, import_line in fixes.items():
              if not path.exists():
                  raise SystemExit(f"Expected source file missing: {path}")
              text = path.read_text()
              if import_line not in text:
                  lines = text.splitlines()
                  package_idx = next((i for i, line in enumerate(lines) if line.startswith("package ")), None)
                  if package_idx is None:
                      raise SystemExit(f"Package declaration missing: {path}")
                  lines.insert(package_idx + 2, import_line)
                  path.write_text("\n".join(lines) + "\n")
                  print(f"Applied: {path.name}: {import_line}")
              else:
                  print(f"Already present: {path.name}: {import_line}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Budsy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-apk
          path: Budsy.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ steps.p.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
