
name: Build Nord Buds Studio APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nord Buds Studio
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Extract the ZIP committed to the repository
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/NordBudsStudio.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::NordBudsStudio.zip not found in repository root"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              -not -path '*/.git/*' | sort
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nordbuds-project"
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/nordbuds-project"

          echo "ZIP extracted successfully."
          find "$RUNNER_TEMP/nordbuds-project" \
            -maxdepth 4 -type f | sort | head -150

      # Find the actual Android project inside extracted files
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_DIR="$RUNNER_TEMP/nordbuds-project"
          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/app/build.gradle}"

            if [ -f "$candidate/settings.gradle" ] &&
               [ -f "$candidate/build.gradle" ] &&
               [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$SEARCH_DIR" -type f \
              -path '*/app/build.gradle' | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found inside ZIP"
            echo "Expected settings.gradle, build.gradle and app/build.gradle."
            find "$SEARCH_DIR" -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Verify Project Files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/kayroot/nordbudsstudio/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"

          echo "All project files verified."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          ls -lh "$APK"
          echo "APK generated successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NordBudsStudio-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
