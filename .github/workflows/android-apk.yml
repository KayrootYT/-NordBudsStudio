
name: Build and verify Budsy Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budsy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Budsy APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          # Extract the uploaded Budsy.zip into a temporary directory.
          if [[ -f "Budsy.zip" ]]; then
            mkdir -p "$RUNNER_TEMP/budsy-extracted"
            unzip -oq "Budsy.zip" -d "$RUNNER_TEMP/budsy-extracted"
          fi

          # Search repository and extracted ZIP for a Gradle Android project.
          PROJECT_DIR=""

          for ROOT in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/budsy-extracted"; do
            [[ -d "$ROOT" ]] || continue

            while IFS= read -r SETTINGS; do
              CANDIDATE="$(dirname "$SETTINGS")"

              if [[ -f "$CANDIDATE/app/build.gradle" || \
                    -f "$CANDIDATE/app/build.gradle.kts" ]]; then
                PROJECT_DIR="$CANDIDATE"
                break 2
              fi
            done < <(
              find "$ROOT" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path '*/.git/*' \
                -not -path '*/node_modules/*' \
                -not -path '*/.gradle/*' | sort
            )
          done

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android Gradle project not found." >&2
            echo "ZIP contents:" >&2
            if [[ -f Budsy.zip ]]; then
              unzip -l Budsy.zip >&2 || true
            fi
            echo "Gradle settings files:" >&2
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/budsy-extracted" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            echo "No Gradle wrapper found; using Gradle 8.9."
            gradle --version >/dev/null 2>&1 || {
              echo "Gradle is not installed." >&2
              exit 1
            }
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      - name: Verify APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated: $APK" >&2
            find "$PROJECT_DIR/app/build/outputs" -type f -print \
              2>/dev/null || true
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/Budsy-debug.apk"
          ls -lh "$RUNNER_TEMP/Budsy-debug.apk"

      - name: Upload Budsy APK
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-debug-apk
          path: ${{ runner.temp }}/Budsy-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
          
