
name: Build Budsy APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budsy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Budsy Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [[ -f "$candidate/app/build.gradle" || \
                  -f "$candidate/app/build.gradle.kts" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/.gradle/*' | sort
          )

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android Gradle project not found." >&2
            echo "Expected settings.gradle or settings.gradle.kts" >&2
            echo "and app/build.gradle or app/build.gradle.kts." >&2
            echo "Repository root:" >&2
            ls -la >&2
            echo "Settings files found:" >&2
            find . -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.git/*' -print >&2 || true
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [[ -n "$PROJECT_DIR" ]] || PROJECT_DIR="."

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify and rename APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          SOURCE_APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_APK="$PROJECT_DIR/app/build/outputs/apk/debug/Budsy-debug.apk"

          if [[ ! -s "$SOURCE_APK" ]]; then
            echo "ERROR: Expected APK not found: $SOURCE_APK" >&2
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          cp "$SOURCE_APK" "$OUTPUT_APK"
          test -s "$OUTPUT_APK"
          ls -lh "$OUTPUT_APK"

      - name: Upload Budsy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/Budsy-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
