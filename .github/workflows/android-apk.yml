
name: Build and verify Budsy Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budsy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Budsy Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          set -euo pipefail
          test -s Budsy.zip
          mkdir -p _budsy_extract
          unzip -o Budsy.zip -d _budsy_extract
          test -f _budsy_extract/settings.gradle
          test -f _budsy_extract/app/build.gradle

      - name: Build debug APK
        working-directory: _budsy_extract
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify and rename APK
        run: |
          set -euo pipefail
          APK="_budsy_extract/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" Budsy-debug.apk
          test -s Budsy-debug.apk
          sha256sum Budsy-debug.apk
          ls -lh Budsy-debug.apk

      - name: Upload Budsy APK
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-debug-apk
          path: Budsy-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-build-diagnostics
          path: |
            _budsy_extract/**/build/reports/**
            _budsy_extract/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
