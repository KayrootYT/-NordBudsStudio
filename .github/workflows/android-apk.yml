name: Build Budsy APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if it was uploaded as a zip
        run: |
          for z in $(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*"); do
            echo "Extracting $z"
            unzip -q -o "$z" -d project_from_zip
          done
          true
      - name: Find Gradle project folder
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Upload the Budsy project files (app folder, settings.gradle.kts, build.gradle.kts) to the repo."
            ls -R | head -40
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Budsy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Budsy-apk
          path: Budsy.apk
