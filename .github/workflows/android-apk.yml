
name: Build Nord Buds Studio APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Configure Android SDK without requesting obsolete tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 5. Install SDK packages and accept licenses
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # Avoid failing the workflow when yes receives SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          # Install required Android SDK components.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Find project even if files are inside a subfolder
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/app/build.gradle}"

            if [ -f "$candidate/settings.gradle" ] &&
               [ -f "$candidate/build.gradle" ] &&
               [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -type f -path '*/app/build.gradle' \
              -not -path '*/.gradle/*' | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project files not found"

            echo "Repository file listing:"
            find . -maxdepth 7 -type f | sort | head -250

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      # 7. Verify source files
      - name: Verify Project Files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/kayroot/nordbudsstudio/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"

          echo "All required project files found."

      # 8. Compile Android project
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      # 9. Confirm APK exists
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK build successful"
          ls -lh "$APK"

      # 10. Upload APK to GitHub Actions artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NordBudsStudio-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
